<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090D16; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="edgeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="edgeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* CSS Keyframe Animations */
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #38BDF8); }
      }
      @keyframes flowEdge {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatPillReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes shimmerText {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.75; }
      }

      .node-pulse-1 { transform-origin: 150px 90px; animation: pulseNode 3s ease-in-out infinite; }
      .node-pulse-2 { transform-origin: 1050px 100px; animation: pulseNode 3.5s ease-in-out infinite 0.6s; }
      .node-pulse-3 { transform-origin: 1080px 320px; animation: pulseNode 4s ease-in-out infinite 1.2s; }
      .node-pulse-4 { transform-origin: 120px 330px; animation: pulseNode 3.2s ease-in-out infinite 1.8s; }

      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowEdge 2.5s linear infinite;
      }
      .flow-line-fast {
        stroke-dasharray: 6 5;
        animation: flowEdge 1.8s linear infinite;
      }

      .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
      .pill-float-2 { animation: floatPillReverse 5.5s ease-in-out infinite 0.8s; }
      .pill-float-3 { animation: floatPill 6s ease-in-out infinite 1.5s; }
      .pill-float-4 { animation: floatPillReverse 4.8s ease-in-out infinite 0.4s; }

      .cache-badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="100%" height="100%" fill="#090D16" rx="14" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="14" />
  <rect width="100%" height="100%" fill="url(#bgGlow1)" rx="14" />
  <rect width="100%" height="100%" fill="url(#bgGlow2)" rx="14" />

  <!-- DYNAMIC BACKGROUND ACTION-GRAPH / DAG FLOWS -->
  <g opacity="0.65">
    <!-- Graph Connecting Lines -->
    <path class="flow-line" d="M 150 90 L 320 140" fill="none" stroke="url(#edgeGrad1)" stroke-width="2.5" />
    <path class="flow-line" d="M 120 330 L 280 280" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" />
    <path class="flow-line-fast" d="M 320 140 L 480 90" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" />
    <path class="flow-line" d="M 880 140 L 1050 100" fill="none" stroke="url(#edgeGrad1)" stroke-width="2.5" />
    <path class="flow-line-fast" d="M 900 280 L 1080 320" fill="none" stroke="url(#edgeGrad2)" stroke-width="2" />
    <path class="flow-line" d="M 720 90 L 880 140" fill="none" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.8" />
    <path class="flow-line" d="M 280 280 L 450 340" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" />
    <path class="flow-line-fast" d="M 750 340 L 900 280" fill="none" stroke="#F472B6" stroke-width="2" stroke-opacity="0.7" />

    <!-- Graph Nodes Left -->
    <g class="node-pulse-1">
      <circle cx="150" cy="90" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
      <circle cx="150" cy="90" r="6" fill="#38BDF8" />
    </g>
    <circle cx="320" cy="140" r="10" fill="#0F172A" stroke="#818CF8" stroke-width="2.5" />
    <circle cx="280" cy="280" r="11" fill="#0F172A" stroke="#10B981" stroke-width="2.5" />
    <circle cx="480" cy="90" r="8" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
    <circle cx="450" cy="340" r="8" fill="#0F172A" stroke="#34D399" stroke-width="2" />

    <g class="node-pulse-4">
      <circle cx="120" cy="330" r="15" fill="#1E293B" stroke="#10B981" stroke-width="3" />
      <circle cx="120" cy="330" r="5" fill="#10B981" />
    </g>

    <!-- Graph Nodes Right -->
    <g class="node-pulse-2">
      <circle cx="1050" cy="100" r="18" fill="#1E293B" stroke="#818CF8" stroke-width="3" />
      <circle cx="1050" cy="100" r="7" fill="#818CF8" />
    </g>
    <circle cx="880" cy="140" r="11" fill="#0F172A" stroke="#F472B6" stroke-width="2.5" />
    <circle cx="900" cy="280" r="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="720" cy="90" r="8" fill="#0F172A" stroke="#C084FC" stroke-width="2" />
    <circle cx="750" cy="340" r="8" fill="#0F172A" stroke="#FB7185" stroke-width="2" />

    <g class="node-pulse-3">
      <circle cx="1080" cy="320" r="17" fill="#1E293B" stroke="#06B6D4" stroke-width="3" />
      <circle cx="1080" cy="320" r="6" fill="#06B6D4" />
    </g>
  </g>

  <!-- FLOATING STATUS PILLS (SURROUNDING, NOT OVERLAPPING CENTER TITLE) -->
  <g class="pill-float-1">
    <g transform="translate(70, 160)">
      <rect width="175" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="20" cy="17" r="5" fill="#10B981" />
      <text x="34" y="22" fill="#E2E8F0" class="cache-badge">⚡ Cache Hit: 99.4%</text>
    </g>
  </g>

  <g class="pill-float-2">
    <g transform="translate(950, 165)">
      <rect width="180" height="34" rx="17" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="20" cy="17" r="5" fill="#A78BFA" />
      <text x="34" y="22" fill="#E2E8F0" class="cache-badge">⚙️ REAPI Remote Exec</text>
    </g>
  </g>

  <g class="pill-float-3">
    <g transform="translate(85, 235)">
      <rect width="165" height="32" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="1.2" opacity="0.9" />
      <text x="18" y="21" fill="#A7F3D0" class="cache-badge">🛡️ Hermetic Builds</text>
    </g>
  </g>

  <g class="pill-float-4">
    <g transform="translate(965, 240)">
      <rect width="155" height="32" rx="16" fill="#0F172A" stroke="#F472B6" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="21" fill="#FBCFE8" class="cache-badge">🚀 Affected-Only CI</text>
    </g>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (CLEAN, PROMINENT & PROTECTED) -->
  <!-- Subtle dark backdrop card behind text to guarantee 100% legibility -->
  <rect x="230" y="70" width="740" height="280" rx="20" fill="#0B1120" fill-opacity="0.75" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Category Tag -->
  <g transform="translate(460, 95)">
    <rect width="280" height="28" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <text x="140" y="18" text-anchor="middle" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="175" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-1.2">
    Awesome Monorepo
  </text>
  <text x="600" y="225" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="800" letter-spacing="-0.8">
    &amp; Build Systems
  </text>

  <!-- Subtitle -->
  <text x="600" y="272" text-anchor="middle" fill="#94A3B8" font-size="16" font-weight="500" letter-spacing="0.2">
    Action-Graph Orchestration • Distributed Remote Caching • Hermetic Reproducibility
  </text>

  <!-- Ecosystem Tool Logos / Pills below Subtitle -->
  <g transform="translate(290, 305)">
    <!-- Bazel -->
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="40" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">Bazel</text>

    <!-- Turborepo -->
    <rect x="90" y="0" width="105" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="142" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">Turborepo</text>

    <!-- Nx -->
    <rect x="205" y="0" width="65" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="237" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">Nx</text>

    <!-- Buck2 -->
    <rect x="280" y="0" width="80" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="320" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">Buck2</text>

    <!-- Pants -->
    <rect x="370" y="0" width="75" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="407" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">Pants</text>

    <!-- NativeLink -->
    <rect x="455" y="0" width="100" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="505" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">NativeLink</text>

    <!-- Gradle -->
    <rect x="565" y="0" width="85" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="607" y="16" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600">Gradle</text>
  </g>
</svg>
